# Rocket PMS alone (standalone mode, its own sign-in), with its demo data: the brick's own compose.yaml + compose.demo.yaml.
#   docker compose -f compose.pms.yaml up -d --build   →  http://localhost:3700, documentation http://localhost:3701
# ROCKET_PMS_DIR: checkout of the brick, relative to this directory (default ../rocket-pms). Same ports as the suite:
# stop one before starting the other.
name: rocket-pms

include:
  - path:
      - ${ROCKET_PMS_DIR:-../rocket-pms}/compose.yaml
      - ${ROCKET_PMS_DIR:-../rocket-pms}/compose.demo.yaml
