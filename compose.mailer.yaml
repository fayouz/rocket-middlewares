# Rocket Mailer alone (standalone mode, its own sign-in), with its demo data: the brick's own compose.yaml + compose.demo.yaml.
#   docker compose -f compose.mailer.yaml up -d --build   →  http://localhost:3000, Mailpit http://localhost:8025, documentation http://localhost:3001
# ROCKET_MAILER_DIR: checkout of the brick, relative to this directory (default ../rocket-mailer). Same ports as the suite:
# stop one before starting the other.
name: rocket-mailer

include:
  - path:
      - ${ROCKET_MAILER_DIR:-../rocket-mailer}/compose.yaml
      - ${ROCKET_MAILER_DIR:-../rocket-mailer}/compose.demo.yaml
