# Rocket Doc Fusion alone (standalone mode, its own sign-in), with its demo data: the brick's own compose.yaml + compose.demo.yaml.
#   docker compose -f compose.doc-fusion.yaml up -d --build   →  http://localhost:3400, ONLYOFFICE http://localhost:8480, documentation http://localhost:3401
# ROCKET_DOC_FUSION_DIR: checkout of the brick, relative to this directory (default ../rocket-doc-fusion). Same ports as the suite:
# stop one before starting the other.
name: rocket-doc-fusion

include:
  - path:
      - ${ROCKET_DOC_FUSION_DIR:-../rocket-doc-fusion}/compose.yaml
      - ${ROCKET_DOC_FUSION_DIR:-../rocket-doc-fusion}/compose.demo.yaml
