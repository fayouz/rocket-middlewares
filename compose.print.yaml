# Rocket Print alone (standalone mode, its own sign-in), with its demo data: the brick's own compose.yaml + compose.demo.yaml.
#   docker compose -f compose.print.yaml up -d --build   →  http://localhost:3300, documentation http://localhost:3301
# ROCKET_PRINT_DIR: checkout of the brick, relative to this directory (default ../rocket-print). Same ports as the suite:
# stop one before starting the other.
name: rocket-print

include:
  - path:
      - ${ROCKET_PRINT_DIR:-../rocket-print}/compose.yaml
      - ${ROCKET_PRINT_DIR:-../rocket-print}/compose.demo.yaml
